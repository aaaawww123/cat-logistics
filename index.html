var FB="https://firestore.googleapis.com/v1/projects/"+PID+"/databases/(default)/documents";

function toF(o){
  var f={};
  for(var k in o){
    var v=o[k];
    if(v==null)f[k]={nullValue:null};
    else if(typeof v==="boolean")f[k]={booleanValue:v};
    else if(typeof v==="number")f[k]={doubleValue:v};
    else if(Array.isArray(v)||typeof v==="object")f[k]={stringValue:JSON.stringify(v)};
    else f[k]={stringValue:String(v)};
  }
  return f;
}
function pD(fields){
  var o={};
  for(var k in fields){
    var v=fields[k];
    if(v.stringValue!==undefined){try{o[k]=JSON.parse(v.stringValue);}catch(e){o[k]=v.stringValue;}}
    else if(v.booleanValue!==undefined)o[k]=v.booleanValue;
    else if(v.doubleValue!==undefined)o[k]=v.doubleValue;
    else if(v.integerValue!==undefined)o[k]=parseInt(v.integerValue);
    else o[k]=null;
  }
  return o;
}
function fsG(c){
  return fetch(FB+"/"+c+"?key="+AK+"&pageSize=500").then(function(r){return r.json();}).then(function(d){
    if(!d.documents)return[];
    return d.documents.map(function(doc){return Object.assign({id:doc.name.split("/").pop()},pD(doc.fields));});
  }).catch(function(){return[];});
}
function fsS(c,id,data){
  return fetch(FB+"/"+c+"/"+id+"?key="+AK,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:toF(data)})}).catch(function(){});
}
function fsD(c,id){return fetch(FB+"/"+c+"/"+id+"?key="+AK,{method:"DELETE"}).catch(function(){});}

// localStorage fallback for users only (faster)
var USERS_KEY='cat_users';
function lsGetUsers(){try{return JSON.parse(localStorage.getItem(USERS_KEY)||'null');}catch(e){return null;}}
function lsSaveUsers(users){localStorage.setItem(USERS_KEY,JSON.stringify(users));}

function getNextOrderNo(){
  // Step1: get max orderNo from existing orders in memory
  var localMax=S.orders.reduce(function(mx,o){
    var n=parseInt(o.orderNo)||0;
    return n>mx?n:mx;
  },1000);
  // Step2: also check Firebase counter, use whichever is bigger
  return fetch(FB+"/meta/orderCounter?key="+AK).then(function(r){return r.json();}).then(function(d){
    var cloudN=1000;
    if(d.fields&&d.fields.count){
      if(d.fields.count.integerValue)cloudN=parseInt(d.fields.count.integerValue);
      else if(d.fields.count.doubleValue)cloudN=parseInt(d.fields.count.doubleValue);
    }
    var n=Math.max(localMax,cloudN)+1;
    return fsS("meta","orderCounter",{count:n}).then(function(){return String(n);});
  }).catch(function(){
    // Offline fallback: use local max+1
    return String(localMax+1);
  });
}

function loadOrders(){
  set({loading:true,sync:"syncing"});
  return fsG("orders").then(function(d){
    d.sort(function(a,b){return(parseInt(b.orderNo)||0)-(parseInt(a.orderNo)||0);});
    set({orders:d,loading:false,sync:"ok"});
    return d;
  }).catch(function(){set({loading:false,sync:"idle"});return[];});
}

function loadUsers(){
  return fsG("users").then(function(d){
    if(d.length>0){
      lsSaveUsers(d);
      S.users=d;
    }else{
      DEFAULT_USERS.forEach(function(u){fsS("users",u.id,u);});
    }
  }).catch(function(){});
}

function saveForm(){

  if(!f.customerName.trim()||!f.customerPhone.trim()){set({ferr:"请填写客户姓名和电话"});return;}
  set({sync:"syncing"});
  if(S.editId){
    var upd=Object.assign({},f,{updatedAt:nowStr(),timeline:(f.timeline||[]).concat([{time:nowStr(),action:"订单信息更新",by:S.user.name}])});
    fsS("orders",S.editId,upd).then(function(){
      S.orders=S.orders.map(function(o){return o.id===S.editId?Object.assign({},upd,{id:S.editId}):o;});
      S.sync="ok";closeForm();render();

function exportExcel(orders){
  // ── Sheet 1: Orders ──
  var H1=["订单编号","业务","运输","付款","客户姓名","电话","收货地址","货物清单","件数","重量(kg)","国内单号","国际单号","运费","到付金额","成本","状态","创建时间","备注"];
  var R1=orders.map(function(o){
    var its=Array.isArray(o.items)?o.items:[];
    var itS=its.filter(function(r){return r.itemName;}).map(function(r){return r.itemName+"x"+(r.qty||0);}).join(" | ");
    var tQ=its.reduce(function(s,r){return s+(parseFloat(r.qty)||0);},0);
    var tW=its.reduce(function(s,r){return s+(parseFloat(r.weight)||0);},0).toFixed(1);
    // prefix phone with tab to prevent scientific notation
    var phone=o.customerPhone?"	"+(o.customerPhone||""):"";
    return[
      o.orderNo||"", o.bizType||"", o.shipType||"", o.payStatus||"",
      o.customerName||"", phone, o.customerAddress||"",
      itS, tQ, tW,
      o.domesticTrackNos||"", o.intlTrackNo||"",
      o.fee||"", o.codAmount||"", o.cost||"",
      o.status||"", o.createdAt||"", o.remark||""
    ];
  });

  // ── Sheet 2: Purchase lists (one row per product) ──
  var H2=["订单编号","客户姓名","#","商品名称","链接/货号","规格/颜色","数量","单价(元)","小计(元)","备注"];
  var R2=[];
  orders.forEach(function(o){
    var prds=Array.isArray(o.products)?o.products:[];
    var validPrds=prds.filter(function(p){return p.name||p.link||p.qty;});
    if(validPrds.length===0)return;
    validPrds.forEach(function(p,i){
      var sub=p.qty&&p.price?(parseFloat(p.qty)||0)*(parseFloat(p.price)||0):"";
      R2.push([
        o.orderNo||"", o.customerName||"",
        i+1, p.name||"", p.link||"", p.spec||"",
        p.qty||"", p.price||"",
        sub!==""?sub.toFixed(2):"",
        p.remark||""
      ]);
    });
  });

  function toCSV(headers, rows){
    var all=[headers].concat(rows);
    return all.map(function(row){
      return row.map(function(cell){
        var s=String(cell).replace(/"/g,'""');
        return '"'+s+'"';
      }).join(',');
    }).join('\r\n');
  }

  // Download orders CSV
  var bom='\uFEFF';
  var csv1=bom+toCSV(H1,R1);
  var blob1=new Blob([csv1],{type:'text/csv;charset=utf-8;'});
  var url1=URL.createObjectURL(blob1);
  var a1=document.createElement('a');
  var date=new Date();
  var dateStr=date.getFullYear()+'-'+(date.getMonth()+1)+'-'+date.getDate();
  a1.href=url1; a1.download='cat-orders-'+dateStr+'.csv';
  document.body.appendChild(a1); a1.click();
  setTimeout(function(){document.body.removeChild(a1);URL.revokeObjectURL(url1);},300);

  // Download purchase list CSV (only if there are products)
  if(R2.length>0){
    var csv2=bom+toCSV(H2,R2);
    var blob2=new Blob([csv2],{type:'text/csv;charset=utf-8;'});
    var url2=URL.createObjectURL(blob2);
    var a2=document.createElement('a');
    a2.href=url2; a2.download='cat-purchase-list-'+dateStr+'.csv';
    document.body.appendChild(a2);
    setTimeout(function(){a2.click();setTimeout(function(){document.body.removeChild(a2);URL.revokeObjectURL(url2);},300);},400);
  }
}

function renderProfit(){
  var t=T();var orders=S.orders;
  var tRev=orders.reduce(function(s,o){return s+(parseFloat(o.fee)||0)+(parseFloat(o.codAmount)||0);},0);
  var tCost=orders.reduce(function(s,o){return s+(parseFloat(o.cost)||0);},0);
  var tProfit=tRev-tCost;
  var rate=tRev>0?(tProfit/tRev*100).toFixed(1):0;
  var monthly={};
  orders.forEach(function(o){
    if(!o.createdAt)return;
    var m=o.createdAt.split('/').slice(0,2).join('/');
    if(!monthly[m])monthly[m]={count:0,rev:0,cost:0};
    monthly[m].count++;
    monthly[m].rev+=(parseFloat(o.fee)||0)+(parseFloat(o.codAmount)||0);
    monthly[m].cost+=parseFloat(o.cost)||0;
  });
  var months=Object.entries(monthly).sort(function(a,b){return b[0].localeCompare(a[0]);}).slice(0,12);
  var html='<div>'
    +'<div style="font-weight:800;font-size:16px;margin-bottom:12px">📈 '+t.profitTitle+'</div>'
    +'<div class="g4" style="margin-bottom:12px">'
    +'<div class="profit-stat"><div class="profit-n" style="color:#3b82f6">¥'+tRev.toFixed(0)+'</div><div class="profit-l">'+t.totalRevenue+'</div></div>'
    +'<div class="profit-stat" style="background:#fef2f2"><div class="profit-n" style="color:#ef4444">¥'+tCost.toFixed(0)+'</div><div class="profit-l">'+t.totalCost+'</div></div>'
    +'<div class="profit-stat" style="background:'+(tProfit>=0?'#f0fdf4':'#fef2f2')+'"><div class="profit-n" style="color:'+(tProfit>=0?'#22c55e':'#ef4444')+'">¥'+tProfit.toFixed(0)+'</div><div class="profit-l">'+t.totalProfit+'</div></div>'
    +'<div class="profit-stat" style="background:#fff7ed"><div class="profit-n" style="color:#f97316">'+rate+'%</div><div class="profit-l">'+t.profitRate+'</div></div>'
    +'</div>'
    +'<div style="background:white;border-radius:14px;overflow:hidden;border:1px solid #e5e7eb;margin-bottom:12px">'
    +'<div style="background:linear-gradient(135deg,#1e3a5f,#2d5a8e);color:white;padding:14px 18px;font-weight:700;font-size:14px">📅 '+t.monthlyReport+'</div>'
    +'<div style="overflow-x:auto"><table class="tbl" style="font-size:13px">'
    +'<thead><tr><th>'+t.monthCol+'</th><th style="text-align:center">'+t.orderCount+'</th><th style="text-align:right">'+t.revenue+'</th><th style="text-align:right">'+t.costCol+'</th><th style="text-align:right">'+t.profitCol+'</th><th style="text-align:center">'+t.profitRate+'</th></tr></thead>'
    +'<tbody>';
  if(months.length===0){
    html+='<tr><td colspan="6" style="text-align:center;padding:20px;color:#9ca3af">'+t.noData+'</td></tr>';
  }else{
    months.forEach(function(entry){
      var m=entry[0],d=entry[1];
      var p=d.rev-d.cost;var r=d.rev>0?(p/d.rev*100).toFixed(1):0;
      html+='<tr><td style="font-weight:600">'+m+'</td><td style="text-align:center">'+d.count+'</td>'
        +'<td style="text-align:right;color:#3b82f6">¥'+d.rev.toFixed(0)+'</td>'
        +'<td style="text-align:right;color:#ef4444">¥'+d.cost.toFixed(0)+'</td>'
        +'<td style="text-align:right;font-weight:700;color:'+(p>=0?'#22c55e':'#ef4444')+'">¥'+p.toFixed(0)+'</td>'
        +'<td style="text-align:center"><span class="badge '+(p>=0?'bgn':'brd')+'">'+r+'%</span></td></tr>';
    });
  }
  html+='<tr style="background:#f0fdf4;font-weight:700"><td>'+t.totalRow+'</td><td style="text-align:center">'+orders.length+'</td>'
    +'<td style="text-align:right;color:#3b82f6">¥'+tRev.toFixed(0)+'</td>'
    +'<td style="text-align:right;color:#ef4444">¥'+tCost.toFixed(0)+'</td>'
    +'<td style="text-align:right;font-weight:800;color:'+(tProfit>=0?'#22c55e':'#ef4444')+'">¥'+tProfit.toFixed(0)+'</td>'
    +'<td style="text-align:center"><span class="badge '+(tProfit>=0?'bgn':'brd')+'">'+rate+'%</span></td></tr>'
    +'</tbody></table></div></div></div>';
  return html;
}

      +[[t.all,"全部"],[t.unpaidF,"未付"],[t.paidF,"已付"]].map(function(p){return'<button class="fb'+(S.fPay===p[1]?' fbo':'')+'" onclick="S.fPay=\''+p[1]+'\';render()">'+p[0]+'</button>';}).join("")

        +(u.id===S.user.id?'<span class="badge bbl">'+t.currentTag+'</span>':"")

        +'<div style="display:flex;gap:6px">'
        +'<button class="btn bo bsm" onclick="S.sf={username:\''+u.username+'\',password:\''+u.password+'\',name:\''+u.name+'\',role:\''+u.role+'\'};S.esid=\''+u.id+'\';S.serr=\'\';set({showStaff:true})">'+t.editBtn2+'</button>'
        +'<button class="btn bb bsm" onclick="S.showPwd={id:\''+u.id+'\',name:\''+u.name+'\',username:\''+u.username+'\'};S.pf={old:\'\',newp:\'\',conf:\'\'};S.perr=\'\';render()">'+t.changePwd+'</button>'
        +(u.id!==S.user.id?'<button class="btn br bsm" onclick="delStaff(\''+u.id+'\')">'+t.delBtn2+'</button>':"")
        +'</div></div>';
    });
    tabContent='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'
      +'<div style="font-weight:700;font-size:16px">'+t.staffMgmt+' <span style="font-size:13px;color:#9ca3af;font-weight:400">('+S.users.length+')</span></div>'
      +'<button class="btn bo" onclick="S.sf={username:\'\',password:\'\',name:\'\',role:\'staff\'};S.esid=null;S.serr=\'\';set({showStaff:true})">'+t.addStaff+'</button></div>'+sc;
  }else if(S.tab==="settings"){
    tabContent='<div style="display:flex;flex-direction:column;gap:12px">'
      +'<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:6px">'+t.cloudSync+'</div>'
      +'<div style="font-size:12px;color:#6b7280;margin-bottom:12px">'+t.dataDesc+'</div>'
      +'<div style="display:flex;gap:8px"><button class="btn bo" onclick="loadOrders()">'+t.refreshBtn+'</button><button class="btn bgr" onclick="exportExcel(S.orders)">'+t.exportAll+'</button></div></div>'
      +'<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:6px">🔑 '+t.pwdTitle+'</div><div style="font-size:12px;color:#9ca3af;margin-bottom:12px">'+S.user.name+'（'+S.user.username+'）</div>'
      +'<button class="btn bo" onclick="S.showPwd={id:\''+S.user.id+'\',name:\''+S.user.name+'\',username:\''+S.user.username+'\'};S.pf={old:\'\',newp:\'\',conf:\'\'};S.perr=\'\';render()">'+t.changePwdBtn+'</button></div>'
      +'<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:6px">🗑️ '+t.cleanTitle+'</div><div style="font-size:12px;color:#9ca3af;margin-bottom:12px">'+t.cleanDesc+'</div>'
      +'<button class="btn br" onclick="cleanDone()">'+t.cleanBtn+'</button></div>'
      +'</div>';
  }

  return '<div>'+hdr()
    +'<div class="sbar"><div class="g4" style="max-width:600px;margin:0 auto">'
    +'<div class="sbox"><div class="sn" style="color:#1f2937">'+stats.total+'</div><div class="sl">'+t.totalOrders+'</div></div>'
    +'<div class="sbox"><div class="sn" style="color:#b45309">'+stats.transit+'</div><div class="sl">'+t.inTransit+'</div></div>'
    +'<div class="sbox"><div class="sn" style="color:#15803d">'+stats.arrived+'</div><div class="sl">'+t.arrived+'</div></div>'
    +'<div class="sbox"><div class="sn" style="color:#ef4444">'+stats.unpaid+'</div><div class="sl">'+t.unpaid+'</div></div>'
    +'</div></div>'
    +(isA?'<div class="tabs">'
      +'<button class="tab'+(S.tab==='orders'?' on':'')+'" onclick="set({tab:\'orders\'})">'+t.orderMgmt+'</button>'
      +'<button class="tab'+(S.tab==='profit'?' on':'')+'" onclick="set({tab:\'profit\'})">'+t.profit+'</button>'
      +'<button class="tab'+(S.tab==='staff'?' on':'')+'" onclick="set({tab:\'staff\'})">'+t.staffMgmt+'</button>'
      +'<button class="tab'+(S.tab==='settings'?' on':'')+'" onclick="set({tab:\'settings\'})">'+t.settings+'</button>'
      +'</div>':"")
    +'<div class="page">'+tabContent+'</div>'

function filteredOrders(){
  return S.orders.filter(function(o){
    return(S.fSts==="全部"||o.status===S.fSts)&&(S.fBiz==="全部"||o.bizType===S.fBiz)&&(S.fShip==="全部"||o.shipType===S.fShip)&&(S.fPay==="全部"||o.payStatus===S.fPay);
  });
}

function openFormEdit(id){
  var o=S.orders.find(function(x){return x.id===id;});
  if(!o)return;
  set({form:Object.assign({},o,{items:Array.isArray(o.items)?o.items:[eI()],products:Array.isArray(o.products)?o.products:[eP(),eP(),eP(),eP(),eP(),eP()]}),editId:o.id,ferr:"",showForm:true});
}

function renderStaffModal(){
  var t=T();var sf=S.sf;
  return '<div class="overlay" onclick="if(event.target===this)set({showStaff:false})">'
    +'<div class="modal" style="max-width:380px;border-radius:20px 20px 0 0">'
    +'<div class="mhdr"><span>'+(S.esid?t.editStaff:t.addStaffLabel)+'</span><button class="mcl" onclick="set({showStaff:false})">×</button></div>'
    +'<div class="mbody">'
    +'<div><label class="lbl">姓名 *</label><input class="inp" value="'+(sf.name||'')+'" oninput="S.sf.name=this.value"/></div>'
    +'<div><label class="lbl">用户名 *</label><input class="inp" value="'+(sf.username||'')+'" '+(S.esid?'disabled':'')+' oninput="S.sf.username=this.value"/></div>'
    +'<div><label class="lbl">密码 *</label><input class="inp" type="password" value="'+(sf.password||'')+'" oninput="S.sf.password=this.value"/></div>'
    +'<div><label class="lbl">角色</label><select class="inp" onchange="S.sf.role=this.value"><option value="staff"'+(sf.role==='staff'?' selected':'')+'>'+t.staffRole+'</option><option value="admin"'+(sf.role==="admin"?' selected':'')+'>'+t.adminRole+'</option></select></div>'
    +(S.serr?'<div style="color:#ef4444;font-size:12px;padding:8px;background:#fee2e2;border-radius:8px">'+S.serr+'</div>':"")
    +'<div style="display:flex;gap:8px"><button class="btn bg_" style="flex:1" onclick="set({showStaff:false})">取消</button><button class="btn bo" style="flex:1" onclick="saveStaff()">保存</button></div>'
    +'</div></div></div>';
}

function renderPwdModal(){
  var pf=S.pf;
  return '<div class="overlay" onclick="if(event.target===this)set({showPwd:null})">'
    +'<div class="modal" style="max-width:380px;border-radius:20px 20px 0 0">'
    +'<div class="mhdr"><span>'+t.changePwdTitle+'</span><button class="mcl" onclick="set({showPwd:null})">×</button></div>'
    +'<div class="mbody">'
    +'<div style="font-size:13px;color:#9ca3af;padding:8px;background:#f8fafc;border-radius:8px">'+S.showPwd.name+'（'+S.showPwd.username+'）</div>'
    +'<div><label class="lbl">'+t.oldPwd+'</label><input class="inp" type="password" value="'+(pf.old||'')+'" oninput="S.pf.old=this.value"/></div>'
    +'<div><label class="lbl">'+t.newPwd+'</label><input class="inp" type="password" value="'+(pf.newp||'')+'" oninput="S.pf.newp=this.value"/></div>'
    +'<div><label class="lbl">'+t.confPwd+'</label><input class="inp" type="password" value="'+(pf.conf||'')+'" oninput="S.pf.conf=this.value"/></div>'
    +(S.perr?'<div style="color:#ef4444;font-size:12px;padding:8px;background:#fee2e2;border-radius:8px">'+S.perr+'</div>':"")
    +'<div style="display:flex;gap:8px"><button class="btn bg_" style="flex:1" onclick="set({showPwd:null})">'+t.cancel+'</button><button class="btn bo" style="flex:1" onclick="savePwd()">'+t.savePwdBtn+'</button></div>'
    +'</div></div></div>';
}

function renderModals(){
  var existing=document.getElementById('__modals');
  if(existing)existing.remove();
  var div=document.createElement('div');
  div.id='__modals';
  var html="";
  if(S.showForm)html+=renderForm();
  if(S.stsModal)html+=renderSts();
  if(S.detail)html+=renderDetail();
  if(S.showStaff)html+=renderStaffModal();
  if(S.showPwd)html+=renderPwdModal();
  div.innerHTML=html;
  document.body.appendChild(div);
}

function renderOrderList(){
  var el=document.getElementById("order-list-wrap");
  var countEl=document.getElementById("order-count");
  if(!el)return;
  var t=T();
  var isA=S.user&&S.user.role==="admin";
  var q=S.search.toLowerCase();
  var filtered=S.orders.filter(function(o){
    var mS=S.fSts==="全部"||o.status===S.fSts;
    var mB=S.fBiz==="全部"||o.bizType===S.fBiz;
    var mSh=S.fShip==="全部"||o.shipType===S.fShip;
    var mP=S.fPay==="全部"||o.payStatus===S.fPay;
    var mQ=!q||String(o.orderNo||"").includes(q)||String(o.customerName||"").toLowerCase().includes(q)||String(o.customerPhone||"").includes(q)||String(o.id||"").toLowerCase().includes(q)||String(o.intlTrackNo||"").toLowerCase().includes(q)||String(o.domesticTrackNos||"").toLowerCase().includes(q);
    return mS&&mB&&mSh&&mP&&mQ;
  });
  if(countEl)countEl.innerHTML=t.countPre+'<strong style="color:#f97316">'+filtered.length+'</strong>'+t.countSuf;
  var html="";
  if(S.loading){
    html='<div style="text-align:center;padding:60px;color:#9ca3af"><div style="font-weight:600">'+t.loading+'</div></div>';
  }else if(filtered.length===0){
    html='<div style="text-align:center;padding:60px;color:#9ca3af"><div style="font-size:48px;margin-bottom:12px">📭</div><div style="font-weight:600">'+t.noOrder+'</div><div style="font-size:13px;margin-top:6px">'+t.noOrderSub+'</div></div>';
  }else{
    filtered.forEach(function(o){
      var on=String(o.orderNo||o.id||"");
      var eid=JSON.stringify(o.id);
      html+='<div class="ocard">';
      html+='<div class="ocard-t" onclick="set({detail:S.orders.find(function(x){return x.id==='+eid+';})});">';
      html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">';
      html+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
      html+='<span class="ono">#'+on+'</span>';
      html+=sbadge(o.status);
      if(o.shipType)html+='<span class="'+(o.shipType==="空运"?"air":"land")+'">'+(o.shipType==="空运"?"✈️":"🚛")+o.shipType+'</span>';
      if(o.payStatus)html+='<span class="badge '+(o.payStatus==="已付"?"bgn":"brd")+'" style="font-size:10px">'+(o.payStatus==="已付"?t.paidTag:t.unpaidTag)+'</span>';
      html+='</div>';
      html+='<span class="badge bon" style="font-size:10px">'+(o.bizType||"")+'</span>';
      html+='</div>';
      html+='<div style="font-weight:700;font-size:15px;margin-bottom:3px">'+(o.customerName||"")+' <span style="font-weight:400;font-size:12px;color:#9ca3af">'+(o.customerPhone||"")+'</span></div>';
      html+='<div style="font-size:11px;color:#9ca3af">';
      if(o.intlTrackNo)html+='<span>🌐 '+o.intlTrackNo+' </span>';
      if(o.domesticTrackNos)html+='<span>🚚 '+o.domesticTrackNos+'</span>';
      if(o.customerAddress)html+='<div>📍 '+o.customerAddress+'</div>';
      html+='</div></div>';
      html+='<div class="ocard-a">';
      if(isA)html+='<button class="btn bo bxs" onclick="openFormEdit('+eid+')">'+t.editBtn+'</button>';
      html+='<button class="btn bgr bxs" onclick="event.stopPropagation();set({stsModal:S.orders.find(function(x){return x.id==='+eid+';})})">'+t.stsBtn+'</button>';
      html+='<button class="btn bb bxs" onclick="set({detail:S.orders.find(function(x){return x.id==='+eid+';})})">'+t.detailBtn+'</button>';
      if(isA)html+='<button class="btn br bxs" onclick="delOrder('+eid+')">'+t.delBtn+'</button>';
      html+='</div></div>';
    });
  }
  el.innerHTML=html;
}

function render(){
  var a=document.getElementById('app');
  if(!a)return;
  // Save cursor position before re-render
  var si=document.getElementById("search-inp");
  var hadFocus=si&&document.activeElement===si;
  var cursorPos=si?si.selectionStart:0;

  if(S.page==="login")a.innerHTML=renderLogin();
  else if(S.page==="public")a.innerHTML=renderPublic();
  else a.innerHTML=renderDashboard();
  renderModals();

  // Re-wire search input after DOM rebuild
  var si2=document.getElementById("search-inp");
  if(si2){
    si2.value=S.search;
    // Use a named handler so we never double-attach
    si2._searchHandler=function(){
      S.search=si2.value;
      clearTimeout(_searchTimer);
      _searchTimer=setTimeout(renderOrderList,200);
    };
    si2.addEventListener("input",si2._searchHandler);
    // Restore focus if it was there
    if(hadFocus){
      si2.focus();
      try{si2.setSelectionRange(cursorPos,cursorPos);}catch(e){}
    }
  }
}

render();
</script>
